<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>课堂小组积分管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f3f6fb;color:#172033}
button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:1200px;margin:auto;padding:14px}
header{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 16px #0000000d;margin-bottom:14px}
h1{margin:0 0 14px;font-size:25px}.classes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.class-btn{padding:12px 6px;border-radius:11px;background:#e9eef7;color:#24324a;font-weight:700}.class-btn.active{background:#2563eb;color:white}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar button,.primary{padding:11px 15px;border-radius:10px;background:#2563eb;color:white;font-weight:700}.toolbar .gray{background:#e8edf5;color:#24324a}
.notice{font-size:13px;color:#64748b}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.panel{background:#fff;border-radius:18px;padding:16px;box-shadow:0 3px 16px #0000000d}h2{margin:0 0 12px;font-size:19px}
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid #e2e8f0;border-radius:15px;padding:14px}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.name{font-size:18px;font-weight:800}.score{font-size:30px;font-weight:900;margin:8px 0}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.actions button{padding:9px 3px;border-radius:8px;background:#eef3fb;color:#183153;font-weight:700}.actions .plus{background:#dbeafe;color:#1d4ed8}.actions .minus{background:#fee2e2;color:#b91c1c}.mini{display:flex;gap:6px;margin-top:10px}.mini button{padding:7px 10px;border-radius:8px;background:#f1f5f9}
.member{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #edf1f5;font-size:14px}.rank{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf1f5}.rank:first-child{font-weight:800}
.log{max-height:260px;overflow:auto;font-size:13px}.log div{padding:7px 0;border-bottom:1px solid #edf1f5}.empty{text-align:center;color:#94a3b8;padding:30px 5px}
dialog{border:0;border-radius:18px;width:min(430px,calc(100% - 30px));padding:0;box-shadow:0 15px 50px #0004}dialog::backdrop{background:#0007}.modal{padding:20px}.modal h3{margin:0 0 14px}.modal input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:12px}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1;padding:11px;border-radius:10px}.cancel{background:#e2e8f0}.confirm{background:#2563eb;color:#fff}
@media(max-width:800px){.classes{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.groups{grid-template-columns:1fr}}
@media(max-width:430px){.app{padding:9px}h1{font-size:21px}.panel,header{padding:13px;border-radius:14px}.groups{gap:9px}.card{padding:12px}.actions{grid-template-columns:repeat(4,1fr)}.actions button{font-size:13px;padding:9px 1px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>📚 课堂小组积分管理</h1>
<div class="classes" id="classes"></div>
<div class="toolbar">
<button id="addGroup">＋ 添加小组</button>
<button id="resetScores" class="gray">重置本班积分</button>
</div>
<div class="notice">当前班级：<b id="currentClass"></b>　数据自动保存在本设备浏览器中</div>
</header>
<div class="grid">
<section class="panel"><h2>小组</h2><div id="groups" class="groups"></div></section>
<aside>
<section class="panel"><h2>🏆 排行榜</h2><div id="ranking"></div></section>
<section class="panel" style="margin-top:14px"><h2>📝 最近积分记录</h2><div id="logs" class="log"></div></section>
</aside>
</div>
</div>

<dialog id="dialog"><form method="dialog" class="modal" id="form"><h3 id="dialogTitle"></h3><input id="input" autocomplete="off" required><div class="modal-actions"><button value="cancel" class="cancel">取消</button><button value="ok" class="confirm">确定</button></div></form></dialog>

<script>
const KEY="class_group_score_v3";
const classNames=["一班","二班","三班","四班","五班","六班"];
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{};
for(const c of classNames) if(!data[c]) data[c]={groups:[
 {name:"第一组",score:0,members:["学生1","学生2","学生3"]},
 {name:"第二组",score:0,members:["学生4","学生5","学生6"]},
 {name:"第三组",score:0,members:["学生7","学生8","学生9"]},
 {name:"第四组",score:0,members:["学生10","学生11","学生12"]},
 {name:"第五组",score:0,members:["学生13","学生14","学生15"]}
],logs:[]};
let current=localStorage.getItem("currentClass")||"一班", pending=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem("currentClass",current)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 $("currentClass").textContent=current;
 $("classes").innerHTML=classNames.map(c=>`<button class="class-btn ${c===current?"active":""}" data-class="${c}">${c}</button>`).join("");
 const groups=data[current].groups;
 $("groups").innerHTML=groups.length?groups.map((g,i)=>`
 <div class="card">
  <div class="card-top"><div><div class="name">${esc(g.name)}</div><div class="score">${g.score}</div></div>
   <div class="mini"><button data-edit-group="${i}">✏️</button><button data-del-group="${i}">🗑️</button></div>
  </div>
  <div class="actions">
   <button class="plus" data-score="${i}" data-n="1">+1</button><button class="plus" data-score="${i}" data-n="2">+2</button><button class="plus" data-score="${i}" data-n="5">+5</button><button class="plus" data-score="${i}" data-n="10">+10</button>
   <button class="minus" data-score="${i}" data-n="-1">−1</button><button class="minus" data-score="${i}" data-n="-2">−2</button><button class="minus" data-score="${i}" data-n="-5">−5</button><button class="minus" data-score="${i}" data-n="-10">−10</button>
  </div>
  <div style="margin-top:12px;font-weight:700">成员（${g.members.length}）</div>
  ${g.members.map((m,j)=>`<div class="member"><span>${esc(m)}</span><span><button class="mini" data-edit-member="${i},${j}">✏️</button> <button class="mini" data-del-member="${i},${j}">🗑️</button></span></div>`).join("")}
  <div class="mini"><button data-add-member="${i}">＋ 添加学生</button></div>
 </div>`).join(""):`<div class="empty">还没有小组，点击“＋ 添加小组”开始。</div>`;
 const sorted=[...groups].map((g,i)=>({...g,i})).sort((a,b)=>b.score-a.score);
 $("ranking").innerHTML=sorted.length?sorted.map((g,i)=>`<div class="rank"><span>${i+1}. ${esc(g.name)}</span><b>${g.score} 分</b></div>`).join(""):`<div class="empty">暂无排行榜</div>`;
 $("logs").innerHTML=data[current].logs.length?data[current].logs.slice().reverse().map(x=>`<div>${esc(x)}</div>`).join(""):`<div class="empty">暂无记录</div>`;
}
function ask(title,value,cb){
 pending=cb;$("dialogTitle").textContent=title;$("input").value=value||"";$("dialog").showModal();setTimeout(()=>$("input").focus(),50)
}
$("form").addEventListener("submit",e=>{e.preventDefault();let v=$("input").value.trim();if(v&&pending){let f=pending;pending=null;$("dialog").close();f(v)}});
$("classes").addEventListener("click",e=>{let b=e.target.closest("[data-class]");if(b){current=b.dataset.class;save();render()}});
$("addGroup").onclick=()=>ask("添加小组","",name=>{data[current].groups.push({name,score:0,members:[]});data[current].logs.push(`创建小组：${name}`);save();render()});
$("resetScores").onclick=()=>{if(confirm(`确定重置${current}所有小组积分吗？`)){data[current].groups.forEach(g=>g.score=0);data[current].logs.push("重置本班所有积分");save();render()}};
$("groups").addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 let i,n;
 if(t.dataset.score){i=+t.dataset.score;n=+t.dataset.n;let g=data[current].groups[i];g.score+=n;data[current].logs.push(`${g.name} ${n>0?"+":""}${n} 分（现在 ${g.score} 分）`);save();render();return}
 if(t.dataset.editGroup!==undefined){i=+t.dataset.editGroup;ask("修改小组名称",data[current].groups[i].name,name=>{data[current].groups[i].name=name;save();render()});return}
 if(t.dataset.delGroup!==undefined){i=+t.dataset.delGroup;let g=data[current].groups[i];if(confirm(`确定删除“${g.name}”吗？`)){data[current].groups.splice(i,1);save();render()}return}
 if(t.dataset.addMember!==undefined){i=+t.dataset.addMember;ask("添加学生姓名","",name=>{data[current].groups[i].members.push(name);save();render()});return}
 if(t.dataset.editMember){[i,n]=t.dataset.editMember.split(",").map(Number);ask("修改学生姓名",data[current].groups[i].members[n],name=>{data[current].groups[i].members[n]=name;save();render()});return}
 if(t.dataset.delMember){[i,n]=t.dataset.delMember.split(",").map(Number);let name=data[current].groups[i].members[n];if(confirm(`确定移除“${name}”吗？`)){data[current].groups[i].members.splice(n,1);save();render()}}
});
render();
</script>
</body>
</html>
