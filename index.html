<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>课堂小组积分管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f3f6fb;color:#172033}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:1200px;margin:auto;padding:14px}
header{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 16px #0000000d;margin-bottom:14px}
h1{margin:0 0 14px;font-size:25px}
.classes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.class-btn{padding:12px 6px;border-radius:11px;background:#e9eef7;color:#24324a;font-weight:700}
.class-btn.active{background:#2563eb;color:white}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.toolbar button,.primary{padding:11px 15px;border-radius:10px;background:#2563eb;color:white;font-weight:700}
.toolbar .gray{background:#e8edf5;color:#24324a}
.notice{font-size:13px;color:#64748b}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.panel{background:#fff;border-radius:18px;padding:16px;box-shadow:0 3px 16px #0000000d}
h2{margin:0 0 12px;font-size:19px}
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{border:1px solid #e2e8f0;border-radius:15px;padding:14px}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:18px;font-weight:800}
.score{font-size:30px;font-weight:900;margin:8px 0}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.actions button{padding:9px 3px;border-radius:8px;background:#eef3fb;color:#183153;font-weight:700}
.actions .plus{background:#dbeafe;color:#1d4ed8}
.actions .minus{background:#fee2e2;color:#b91c1c}
.mini{display:flex;gap:6px;margin-top:10px}
.mini button{padding:7px 10px;border-radius:8px;background:#f1f5f9}
.member{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #edf1f5;font-size:14px}
.rank{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf1f5}
.rank:first-child{font-weight:800}
.log{max-height:260px;overflow:auto;font-size:13px}
.log div{padding:7px 0;border-bottom:1px solid #edf1f5}
.empty{text-align:center;color:#94a3b8;padding:30px 5px}
dialog{border:0;border-radius:18px;width:min(430px,calc(100% - 30px));padding:0;box-shadow:0 15px 50px #0004}
dialog::backdrop{background:#0007}
.modal{padding:20px}
.modal h3{margin:0 0 14px}
.modal input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:12px}
.modal-actions{display:flex;gap:8px}
.modal-actions button{flex:1;padding:11px;border-radius:10px}
.cancel{background:#e2e8f0}
.confirm{background:#2563eb;color:#fff}

@media(max-width:800px){
.classes{grid-template-columns:repeat(3,1fr)}
.grid{grid-template-columns:1fr}
.groups{grid-template-columns:1fr}
}

@media(max-width:430px){
.app{padding:9px}
h1{font-size:21px}
.panel,header{padding:13px;border-radius:14px}
.groups{gap:9px}
.card{padding:12px}
.actions{grid-template-columns:repeat(4,1fr)}
.actions button{font-size:13px;padding:9px 1px}
}
</style>
</head>

<body>
<div class="app">

<header>
<h1>📚 课堂小组积分管理</h1>

<div class="classes" id="classes"></div>

<div class="toolbar">
<button id="addGroup">＋ 添加小组</button>
<button id="resetScores" class="gray">重置本班积分</button>
</div>

<div class="notice">
当前班级：<b id="currentClass"></b>
　数据自动保存在本设备浏览器中
</div>
</header>

<div class="grid">

<section class="panel">
<h2>小组（<span id="groupCount">0</span>）</h2>
<div id="groups" class="groups"></div>
</section>

<aside>

<section class="panel">
<h2>🏆 排行榜（<span id="rankCount">0</span>组）</h2>
<div id="ranking"></div>
</section>

<section class="panel" style="margin-top:14px">
<h2>📝 最近积分记录</h2>
<div id="logs" class="log"></div>
</section>

</aside>
</div>
</div>

<dialog id="dialog">
<form method="dialog" class="modal" id="form">
<h3 id="dialogTitle"></h3>
<input id="input" autocomplete="off" required>
<div class="modal-actions">
<button value="cancel" class="cancel">取消</button>
<button value="ok" class="confirm">确定</button>
</div>
</form>
</dialog>

<script>

const KEY="class_group_score_v5";

const classNames=[
"一班","二班","三班","四班","五班","六班"
];

const importedLists={

["李敏赫","李玥汐","刘珝歌","刘轩宇"],

["向子沐","费士宸","叶昕霖","余乐雅"],
["袁睿泽","赵桢祺","朱泽宜","周沐雅"],
["李睿涵","王秋筠","余芃然","商长霖","童画"]
],

"六班":[

]

};

function defaultGroups(){

return [1,2,3,4,5].map((n,i)=>({

score:0,

`学生${i*3+1}`,
`学生${i*3+2}`,
`学生${i*3+3}`
]

}));

}

let data=JSON.parse(localStorage.getItem(KEY)||"null");

if(!data){

data={};

for(const c of classNames){

if(importedLists[c]){

data[c]={
groups:importedLists[c].map((members,i)=>({

name:`第${["一","二","三","四","五","六"][i]}组`,
score:0,
members:members

})),
logs:[]
};

}else{

data[c]={
groups:defaultGroups(),
logs:[]
};

}

}

localStorage.setItem(KEY,JSON.stringify(data));

}

for(const c of classNames){

if(!data[c]){

data[c]={
groups:[],

};

}

}

let current=localStorage.getItem("currentClass")||"一班";

let pending=null;

const $=id=>document.getElementById(id);

localStorage.setItem(KEY,JSON.stringify(data));
localStorage.setItem("currentClass",current);

}

function esc(s){

return String(s).replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m]));

}

function render(){

$("currentClass").textContent=current;

$("classes").innerHTML=classNames.map(c=>`

<button
class="class-btn ${c===current?"active":""}"
data-class="${c}">

</button>

`).join("");

const groups=data[current].groups;

$("groups").innerHTML=groups.length?

<div class="card-top">

<div class="score">${g.score}</div>

</div>

<div class="mini">

<button data-edit-group="${i}">✏️</button>

<button data-del-group="${i}">🗑️</button>

</div>

</div>

<button class="plus" data-score="${i}" data-n="2">+2</button>

<button class="minus" data-score="${i}" data-n="-1">−1</button>
<button class="minus" data-score="${i}" data-n="-2">−2</button>

<button class="minus" data-score="${i}" data-n="-10">−10</button>

</div>

成员（${g.members.length}）
</div>

${g.members.map((m,j)=>`

<div class="member">

<span>${esc(m)}</span>

<span>

<button class="
